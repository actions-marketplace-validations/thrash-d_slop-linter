extends: script
message: "Redemption arc: hardship up top, a win at the bottom. Tell what changed and why, or cut the setup."
level: warning
scope: raw
# Hardship words in the first third and success words in the last third.
script: |
  text := import("text")
  body := text.to_lower(text.re_replace(`(?s)<!--.*?-->`, scope, ""))
  third := len(body) / 3
  early := body[:third]
  late := body[len(body) - third:]
  hard := `\b(?:fired|laid off|rejected|broke|bankrupt|homeless|slept in (?:my|a) car|dropped out|failed|cried|nobody would|no one would)\b`
  win := `\b(?:ceo|founder|\d{1,2}-figure|million|acquired|promoted|raised|became (?:their|the)|today (?:i|my|we)|now (?:i|we) (?:run|lead|own))\b`
  matches := []
  if text.re_match(hard, early) && text.re_match(win, late) {
    // Point at the first hardship word in the original text.
    found := text.re_find(hard, text.to_lower(scope), 1)
    if found != undefined {
      matches = append(matches, {begin: found[0][0].begin, end: found[0][0].end})
    }
  }
