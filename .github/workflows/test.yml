name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  VALE_VERSION: "3.22.0"

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install Vale
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -sSfL "https://github.com/vale-cli/vale/releases/download/v${VALE_VERSION}/vale_${VALE_VERSION}_Linux_64-bit.tar.gz" | tar -xz -C "$HOME/bin" vale

      - name: Every rule fires on the samples, and clean files stay clean
        run: python3 tests/run_tests.py

      - name: The comment guard tells PowerShell comments from code
        run: python3 tests/test_comment_guard.py

      - name: The commit linter flags AI-looking messages and passes human ones
        run: python3 tests/test_commit_lint.py

  # The published action, run the way a user runs it.
  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Clean samples pass
        uses: ./
        with:
          files: tests/should-pass.md tests/should-pass.html
          fail-on: warning

      - name: fail-on none reports without failing
        uses: ./
        with:
          files: tests/slop-sample.md
          fail-on: none

      - name: The slop sample fails
        id: slop
        continue-on-error: true
        uses: ./
        with:
          files: tests/slop-sample.md

      - name: Check the slop sample failed
        if: steps.slop.outcome != 'failure'
        run: |
          echo "::error::The action passed tests/slop-sample.md."
          exit 1
